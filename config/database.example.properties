# Copia este archivo como config/database.properties y edita los valores.
# PostgreSQL real por JDBC. La aplicacion no crea servidores ni bases.
DB_URL=jdbc:postgresql://localhost:5432/monitoreo_precios
DB_USER=postgres
DB_PASSWORD=CAMBIAR_POR_TU_CLAVE
CONNECT_TIMEOUT_SECONDS=5
SOCKET_TIMEOUT_SECONDS=15
# Para exigir TLS agrega ?sslmode=require a DB_URL.
# Para validar certificado y servidor utiliza ?sslmode=verify-full.
